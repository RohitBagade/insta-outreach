name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Lint and format
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Tests (incl. real Chromium against the mock Instagram site)
        run: pytest -q

      - name: Deterministic scenario matches the committed transcript
        run: insta-outreach scenario --check
