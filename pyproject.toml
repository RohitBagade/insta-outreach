[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "insta-outreach"
version = "0.1.0"
description = "LemmeDeliver Instagram outreach orchestrator: hybrid Graph API + browser-agent execution behind policy, rate and ownership gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Rohit Bagade" }]
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "playwright>=1.56",
  "anthropic>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
insta-outreach = "insta_outreach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insta_outreach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "browser: launches a real Chromium via Playwright against the local mock Instagram site",
]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012", "SIM108", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's declarative parameter defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "ASYNC240"]
# HTML/JS templates embedded as strings.
"src/insta_outreach/api/dashboard.py" = ["E501"]
"src/insta_outreach/devtools/mock_instagram.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["insta_outreach"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
